<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>JAINEX GRANITES - Balance</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:3}
h1{font-size:21px;margin:0 0 4px}.sub{font-size:13px;opacity:.75}
main{padding:16px;max-width:700px;margin:auto}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
button{border:0;border-radius:12px;padding:13px 15px;font-size:15px;font-weight:600;cursor:pointer}
.primary{background:#111827;color:white;width:100%;font-size:17px;padding:16px}.secondary{background:#e5e7eb}.danger{background:#fee2e2;color:#991b1b}.green{background:#dcfce7;color:#166534}
input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:6px 0 12px}
label{font-size:13px;font-weight:600;color:#374151}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f9fafb;border-radius:12px;padding:13px}.stat b{display:block;font-size:20px;margin-top:4px}
.customer{display:flex;justify-content:space-between;gap:10px;align-items:center}.customer h3{margin:0 0 4px}.muted{color:#6b7280;font-size:13px}.amount{font-weight:800;font-size:18px}
.slip{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #eee}.slip img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:flex-end}.sheet{background:white;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.close{float:right}
.notice{background:#fff7ed;padding:12px;border-radius:12px;font-size:13px;margin-bottom:12px}
</style>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"></head>
<body>
<header><h1>JAINEX GRANITES</h1><div class="sub">Customer Balance • Local phone storage</div></header>
<main>
<button class="primary" onclick="document.getElementById('camera').click()">📷 SCAN / ADD SLIP</button>
<input id="camera" class="hidden" type="file" accept="image/*" capture="environment" onchange="photoSelected(event)">
<div class="stats card"><div class="stat">Customers<b id="count">0</b></div><div class="stat">Outstanding<b id="total">₹0</b></div></div>
<div class="card"><input id="search" placeholder="🔍 Search customer or mobile" oninput="render()"><div id="list"></div></div>
<div class="card"><button class="secondary" onclick="backup()">⬇️ Backup data</button> <button class="secondary" onclick="restore.click()">⬆️ Restore</button><input id="restore" class="hidden" type="file" accept=".json" onchange="restoreData(event)"></div>
</main>

<div id="modal" class="modal hidden"><div class="sheet">
<button class="secondary close" onclick="closeModal()">Close</button>
<h2 id="modalTitle">Add slip</h2>
<div class="notice">The first version saves everything on this iPhone. Check the detected details before saving.</div>
<img id="preview" style="width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:#f3f4f6" class="hidden">
<label>Customer name</label><input id="name">
<label>Mobile number</label><input id="mobile" inputmode="tel">
<label>Purchase / balance amount</label><input id="amount" inputmode="decimal" placeholder="₹">
<label>Date</label><input id="date" type="date">
<div class="row"><button class="primary" onclick="saveRecord()">SAVE</button><button class="secondary" onclick="closeModal()">Cancel</button></div>
</div></div>

<script>
const KEY='jainex_balance_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"customers":[]}');
let pendingPhoto=null, editingCustomer=null;
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function render(){
 let q=(document.getElementById('search').value||'').toLowerCase();
 let cs=data.customers.filter(c=>(c.name+' '+c.mobile).toLowerCase().includes(q));
 document.getElementById('count').textContent=data.customers.length;
 document.getElementById('total').textContent=money(data.customers.reduce((s,c)=>s+Number(c.balance||0),0));
 document.getElementById('list').innerHTML=cs.length?cs.map((c,i)=>`<div class="card customer" style="margin:8px 0;padding:12px" onclick="openCustomer('${c.id}')"><div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.mobile||'No mobile')}</div></div><div class="amount">${money(c.balance)}</div></div>`).join(''):'<div class="muted" style="padding:18px;text-align:center">No customers yet. Scan your first slip.</div>';
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function photoSelected(e){let f=e.target.files[0];if(!f)return;compress(f).then(url=>{pendingPhoto=url;editingCustomer=null;showModal()})}
function compress(file){return new Promise(res=>{let im=new Image();im.onload=()=>{let max=1400,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.58))};im.src=URL.createObjectURL(file)})}
function showModal(c=null){
 document.getElementById('modal').classList.remove('hidden');document.getElementById('modalTitle').textContent=c?'Add purchase/slip':'Add slip';
 document.getElementById('name').value=c?c.name:'';document.getElementById('mobile').value=c?c.mobile:'';
 document.getElementById('amount').value='';document.getElementById('date').value=new Date().toISOString().slice(0,10);
 document.getElementById('preview').src=pendingPhoto||'';document.getElementById('preview').classList.toggle('hidden',!pendingPhoto);
}
function closeModal(){document.getElementById('modal').classList.add('hidden');pendingPhoto=null;document.getElementById('camera').value=''}
function saveRecord(){
 let name=document.getElementById('name').value.trim(),mobile=document.getElementById('mobile').value.trim(),amt=parseFloat(document.getElementById('amount').value)||0,date=document.getElementById('date').value;
 if(!name||amt<=0){alert('Please enter customer name and amount.');return}
 let c=editingCustomer||data.customers.find(x=>mobile&&x.mobile===mobile)||data.customers.find(x=>x.name.toLowerCase()===name.toLowerCase());
 if(!c){c={id:Date.now().toString(),name,mobile,balance:0,slips:[],payments:[]};data.customers.push(c)}
 c.name=name;c.mobile=mobile;c.balance=Number(c.balance||0)+amt;
 c.slips.push({date,amount:amt,photo:pendingPhoto});
 save();closeModal();alert('Saved. Current balance: '+money(c.balance));
}
function openCustomer(id){
 let c=data.customers.find(x=>x.id===id);if(!c)return;
 let slips=c.slips.map(s=>`<div class="slip">${s.photo?`<img src="${s.photo}" onclick="event.stopPropagation();window.open(this.src)">`:'📄'}<div><b>${money(s.amount)}</b><div class="muted">${s.date||''}</div></div></div>`).join('');
 document.getElementById('modalTitle').textContent=c.name;
 document.querySelector('#modal .notice').innerHTML=`<b>Current balance: ${money(c.balance)}</b><br>${esc(c.mobile||'')}`;
 document.getElementById('preview').classList.add('hidden');document.getElementById('name').value=c.name;document.getElementById('mobile').value=c.mobile;
 document.getElementById('amount').value='';document.getElementById('date').value=new Date().toISOString().slice(0,10);
 editingCustomer=c;
 document.querySelector('#modal .row').innerHTML=`<button class="green" onclick="recordPayment()">💵 Payment</button><button class="primary" onclick="addToCustomer()">➕ Add slip</button><button class="danger" onclick="deleteCustomer()">🗑️ Delete</button>`;
 document.getElementById('modal').classList.remove('hidden');
 let old=document.getElementById('slips');if(old)old.remove();let d=document.createElement('div');d.id='slips';d.innerHTML='<h3>Slip history</h3>'+slips;document.querySelector('#modal .notice').after(d);
}
function addToCustomer(){document.getElementById('camera').click()}
function recordPayment(){let v=parseFloat(prompt('Payment received (₹):',''));if(!v||v<=0)return;editingCustomer.balance=Math.max(0,Number(editingCustomer.balance)-v);editingCustomer.payments.push({date:new Date().toISOString().slice(0,10),amount:v});save();if(editingCustomer.balance===0&&confirm('Balance is ₹0. Delete this customer and all slip photos?')){data.customers=data.customers.filter(x=>x!==editingCustomer);save();closeModal()}else{closeModal();alert('Payment saved. Current balance: '+money(editingCustomer.balance))}}
function deleteCustomer(){if(confirm('Delete this customer, all slips and photos permanently?')){data.customers=data.customers.filter(x=>x!==editingCustomer);save();closeModal()}}
function backup(){let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Jainex-Balance-Backup.json';a.click()}
function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.customers){data=x;save();alert('Backup restored.')}}catch(_){alert('Invalid backup file')}};r.readAsText(f)}
render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script></body></html>
